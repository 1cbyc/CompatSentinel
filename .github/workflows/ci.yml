name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint, types, tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format)
        run: ruff format --check .

      - name: Mypy
        run: mypy

      - name: Tests
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      - name: CLI sanity
        run: |
          compatsentinel --help
          compatsentinel doctor

  windows-smoke:
    name: collector smoke (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Doctor
        run: compatsentinel doctor

      - name: Windows-only tests (launch, capture)
        run: pytest -m windows_only -v

      - name: Capture notepad through the CLI
        run: |
          compatsentinel capture --suite examples/apps.yaml --label ci --only notepad --store "$env:RUNNER_TEMP\snapshots"
          Get-Content "$env:RUNNER_TEMP\snapshots\ci\snapshot.json" -TotalCount 40

      - name: WER diagnostics (informational)
        continue-on-error: true
        shell: python
        run: |
          # Crash a throwaway interpreter so WER writes a report, then print what
          # the runner produced. Used to verify the Report.wer parser against a
          # real file; the development machine has WER disabled.
          import codecs, glob, os, subprocess, sys, time
          from compatsentinel import doctor
          print("WER enabled:", doctor.wer_enabled())
          subprocess.run([sys.executable, "-c", "import os; os.abort()"], timeout=120)
          time.sleep(15)
          roots = [os.environ.get("ProgramData", ""), os.environ.get("LOCALAPPDATA", "")]
          pattern = os.path.join("Microsoft", "Windows", "WER", "Report*", "*", "Report.wer")
          files = [f for r in roots for f in glob.glob(os.path.join(r, pattern))]
          print("Report.wer files:", files)
          keys = ("Version", "EventType", "EventTime", "ReportType", "AppName", "AppPath",
                  "Sig[", "FriendlyEventName", "TargetAppVer", "NsAppName")
          for f in files[:2]:
              raw = open(f, "rb").read()
              utf16 = raw.startswith(codecs.BOM_UTF16_LE) or raw.startswith(codecs.BOM_UTF16_BE)
              text = raw.decode("utf-16") if utf16 else raw.decode("utf-8", "replace")
              print("=====", f)
              for line in text.splitlines():
                  if line.startswith(keys):
                      print(line)
