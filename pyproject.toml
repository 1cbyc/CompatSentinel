[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "compatsentinel"
dynamic = ["version"]
description = "Catch Windows app compatibility regressions before your users do."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Juan Rodríguez", email = "juandresrodca@gmail.com" }]
keywords = [
  "windows",
  "compatibility",
  "regression-testing",
  "patch-tuesday",
  "sysadmin",
  "mcp",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Systems Administration",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = [
  "typer>=0.12",
  "pydantic>=2.7",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.8",
]

[project.scripts]
compatsentinel = "compatsentinel.cli:app"

[project.urls]
Homepage = "https://github.com/juandresrodca/CompatSentinel"
Repository = "https://github.com/juandresrodca/CompatSentinel"
Issues = "https://github.com/juandresrodca/CompatSentinel/issues"
Changelog = "https://github.com/juandresrodca/CompatSentinel/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/compatsentinel/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/compatsentinel"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "docs/", "examples/", "README.md", "LICENSE", "CHANGELOG.md"]

# --- Lint & format -----------------------------------------------------------

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "UP",       # pyupgrade (modern syntax)
  "B",        # bugbear (likely bugs)
  "SIM",      # simplify
  "C4",       # comprehensions
  "PTH",      # prefer pathlib over os.path
  "RUF",      # ruff-specific
  "T20",      # no stray print() in library code
]
ignore = [
  "E501",     # line length is enforced by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["compatsentinel"]

# --- Types -------------------------------------------------------------------

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["compatsentinel"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
warn_unreachable = true
show_error_codes = true
pretty = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

# --- Tests -------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "windows_only: needs a real Windows host (launches and closes processes)",
]
xfail_strict = true

[tool.coverage.run]
source = ["compatsentinel"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
